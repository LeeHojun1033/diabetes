<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>당뇨 다마고치</title>
<style>
:root{--bg:#ffd6e8;--shell:#ff8fc7;--lcd:#d9f7e4;--ink:#3b2a5a;--blue:#5ec8ff;--red:#ff6b6b;--yel:#ffd93d;--grn:#5fd68a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1f3d}}
:root[data-theme="dark"]{--bg:#2a1f3d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0;background:var(--bg);font-family:"Galmuri11","DungGeunMo",ui-monospace,Menlo,monospace;color:var(--ink);touch-action:manipulation;overflow:hidden}
#app{height:100%;max-width:480px;margin:0 auto;padding:8px;display:flex;flex-direction:column;gap:8px}
.shell{flex:1;min-height:0;background:var(--shell);border:4px solid var(--ink);border-radius:36px;box-shadow:0 6px 0 var(--ink);padding:12px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:bold;color:#fff;text-shadow:1px 1px 0 var(--ink)}
#ff,#menuBtn{border:3px solid var(--ink);background:var(--yel);border-radius:12px;padding:6px 10px;font:inherit;font-size:13px;color:var(--ink);min-height:36px}
#ff.on{background:var(--red);color:#fff}
.lcd{flex:1;min-height:0;background:var(--lcd);border:4px solid var(--ink);border-radius:14px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
background-image:linear-gradient(rgba(0,0,0,.05) 1px,transparent 1px);background-size:100% 4px;image-rendering:pixelated}
.lcd.night{background-color:#9aa7d9}
.lcd.danger{animation:blink .5s steps(2) infinite}
@keyframes blink{50%{box-shadow:inset 0 0 0 6px var(--red)}}
#pet{font-size:min(30vw,130px);line-height:1;animation:bounce 1s steps(2) infinite}
#pet.sad{animation:shake .3s linear infinite}
#pet.dizzy{animation:spin 1.2s linear infinite}
#pet.sleep,#pet.dead{animation:none}
@keyframes bounce{50%{transform:translateY(-8px)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes spin{to{transform:rotate(360deg)}}
#fx{position:absolute;top:14%;right:22%;font-size:32px;animation:bounce .6s steps(2) infinite}
#bs{position:absolute;top:8px;left:8px;background:var(--ink);color:var(--yel);padding:4px 8px;border-radius:8px;font-size:15px;display:none}
#msg{position:absolute;bottom:6px;left:6px;right:6px;text-align:center;font-size:13px;background:rgba(255,255,255,.75);border:2px solid var(--ink);border-radius:8px;padding:4px;min-height:28px}
.bars{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:13px;color:#fff;font-weight:bold;text-shadow:1px 1px 0 var(--ink);align-items:center}
.bar{height:14px;background:#fff;border:3px solid var(--ink);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;transition:width .2s}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btns button{min-height:68px;border:4px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);background:#fff;font:inherit;font-size:13px;font-weight:bold;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.btns button span{font-size:24px}
.btns button:active{transform:translateY(4px);box-shadow:none}
.btns button:disabled{opacity:.4}
#overlay{position:fixed;inset:0;background:rgba(59,42,90,.85);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;text-align:center;padding:24px;z-index:9}
#overlay h1{font-size:30px;margin:0}#overlay p{margin:0;line-height:1.5}
#overlay button{border:4px solid var(--ink);background:var(--yel);border-radius:16px;padding:14px 28px;font:inherit;font-size:18px;font-weight:bold;min-height:56px}
#pet{height:min(62%,230px);aspect-ratio:1}
#pet svg{width:100%;height:100%}
#tag{position:absolute;top:8px;right:8px;background:var(--ink);color:#fff;padding:4px 8px;border-radius:8px;font-size:12px}
.pane{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;padding:12px;gap:10px;z-index:8;overflow:auto;max-width:480px;margin:0 auto}
#setup{z-index:10}
.pane h2{margin:0;font-size:20px}.pane h3{font-size:15px;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.card{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:8px;min-height:48px;flex:1 1 40%;font:inherit;font-size:13px;color:var(--ink);text-align:center}
.card.sel{background:var(--yel)}.card.lock{opacity:.55}
.card svg{width:64px;height:64px}
.pane input{font:inherit;font-size:18px;border:3px solid var(--ink);border-radius:12px;padding:10px;text-align:center;color:var(--ink)}
.big{border:4px solid var(--ink);background:var(--yel);border-radius:16px;padding:12px 22px;font:inherit;font-size:16px;font-weight:bold;min-height:52px;color:var(--ink)}
.mis{border:3px solid var(--ink);border-radius:12px;background:#fff;padding:8px;font-size:13px;width:100%}
.pb{height:8px;background:#ddd;border-radius:4px;margin:4px 0;overflow:hidden}.pb i{display:block;height:100%;background:var(--grn)}
#stArea{position:relative;flex:1;min-height:260px;background:var(--lcd);border:4px solid var(--ink);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;touch-action:none}
.tool{width:104px;height:104px;font-size:54px;display:flex;align-items:center;justify-content:center;border:4px solid var(--ink);border-radius:26px;background:#fff;box-shadow:0 4px 0 var(--ink);touch-action:none}
.tool.zone{border-style:dashed;background:transparent;box-shadow:none}
.tool.pop{animation:pop .15s}
@keyframes pop{50%{transform:scale(1.2)}}
</style>
</head>
<body>
<div id="app">
  <div class="shell">
    <div class="top"><span id="clock">Day 1 08:00</span><span><button id="menuBtn">📋 미션</button> <button id="ff">⏩ 빨리감기</button></span></div>
    <div class="lcd" id="lcd">
      <div id="bs"></div><div id="fx"></div><div id="tag"></div><div id="pet">😊</div><div id="msg">안녕! 잘 부탁해요.</div>
    </div>
    <div class="bars">
      <span>🍙 포만감</span><div class="bar"><i id="b-hunger" style="background:var(--yel)"></i></div>
      <span>⚡ 에너지</span><div class="bar"><i id="b-energy" style="background:var(--blue)"></i></div>
      <span>💖 기분</span><div class="bar"><i id="b-happy" style="background:var(--red)"></i></div>
    </div>
  </div>
  <div class="btns">
    <button data-act="measure"><span>🩸</span>혈당 측정</button>
    <button data-act="meal"><span>🍚</span>식사</button>
    <button data-act="snack"><span>🍪</span>간식</button>
    <button data-act="insulin"><span>💉</span>인슐린</button>
    <button data-act="exercise"><span>🏃</span>운동</button>
    <button data-act="sleep" id="sleepBtn"><span>🌙</span>수면</button>
  </div>
</div>
<div class="pane" id="setup"><h2>🐾 나의 친구 고르기</h2><div class="row" id="speciesList"></div>
  <input id="nameIn" maxlength="8" placeholder="이름을 지어주세요"><button class="big" id="startBtn">시작하기</button></div>
<div class="pane" id="menu"><div class="row" style="align-items:center"><h2 style="flex:1">⭐ <span id="stars">0</span></h2><button class="big" id="menuClose">닫기</button></div>
  <div class="row"><button class="card" data-tab="mis">미션</button><button class="card" data-tab="shop">꾸미기</button><button class="card" data-tab="char">캐릭터</button></div>
  <div id="menuMsg" style="font-size:13px;min-height:18px"></div><div class="row" id="menuBody"></div></div>
<div class="pane" id="picker" style="z-index:9"><div class="row" style="align-items:center"><h2 id="pkTitle" style="flex:1"></h2><button class="big" id="pkClose">닫기</button></div><div class="row" id="pkBody"></div></div>
<div class="pane" id="stage" style="z-index:9"><div class="row" style="align-items:center"><h2 id="stTitle" style="flex:1"></h2><button class="big" id="stCancel">취소</button></div>
  <div id="stText" style="font-size:16px;font-weight:bold;text-align:center;min-height:24px"></div><div class="pb" style="height:14px"><i id="stBar" style="width:0"></i></div><div id="stArea"></div></div>
<div id="overlay"><h1 id="ov-title"></h1><p id="ov-text"></p><button id="ov-btn">다시 시작</button></div>

<script>
'use strict';
/* ===== 설정: 모든 상수는 여기서만 관리 ===== */
const Config = {
  TIME_SCALE: 10,          // 실시간 1초 = 게임 10분
  FAST_FORWARD: 6,         // 빨리감기 배속 계수
  START_MIN: 480,          // 시작 시각(오전 8시)
  MIN_PER_DAY: 1440,
  CLEAR_DAYS: 7,           // 클리어 생존 일수
  MAX_FRAME_SEC: 0.25,     // 탭 전환 등으로 인한 시간 폭주 방지
  BS: { START: 110, MAX: 500, LOW: 70, HIGH: 150, HYPER: 200, FAINT_LOW: 50, FAINT_HIGH: 300, DRIFT: 0.08 },
  DANGER_LIMIT: 120,       // 위험 혈당 지속 시 기절까지 걸리는 게임 분
  DANGER_RECOVER: 2,       // 안전해지면 위험 누적이 줄어드는 배율
  STAT: { MAX: 100, HUNGER_DECAY: 0.07, ENERGY_DECAY: 0.03, ENERGY_SLEEP: 0.3, HUNGER_SLEEP_RATE: 0.5,
          HAPPY_UP: 0.05, HAPPY_DOWN: 0.15, HAPPY_HUNGRY: 0.1, HAPPY_IDLE: 0.01, STARVE_BS_DROP: 0.15 },
  DIGEST: { slow: 0.4, fast: 1.5 },  // 분당 혈당 상승량(완만/급격)
  // 음식: hunger=포만감, slow/fast=완만/급격히 오르는 혈당량, joy=기분, healthy=건강식 여부
  FOODS: [
    { id: 'brown', kind: 'meal', icon: '🍚', name: '현미밥+나물', hunger: 30, slow: 30, fast: 0, joy: 2, healthy: true },
    { id: 'doenjang', kind: 'meal', icon: '🍲', name: '된장찌개 정식', hunger: 28, slow: 25, fast: 0, joy: 3, healthy: true },
    { id: 'fish', kind: 'meal', icon: '🐟', name: '생선구이 정식', hunger: 28, slow: 20, fast: 0, joy: 3, healthy: true },
    { id: 'tofu', kind: 'meal', icon: '🥚', name: '두부·계란찜', hunger: 22, slow: 12, fast: 0, joy: 2, healthy: true },
    { id: 'salad', kind: 'meal', icon: '🥗', name: '닭가슴살 샐러드', hunger: 20, slow: 10, fast: 0, joy: 1, healthy: true },
    { id: 'bibim', kind: 'meal', icon: '🥘', name: '비빔밥', hunger: 35, slow: 35, fast: 15, joy: 4, healthy: true },
    { id: 'gimbap', kind: 'meal', icon: '🍙', name: '김밥', hunger: 30, slow: 30, fast: 20, joy: 4 },
    { id: 'bulgogi', kind: 'meal', icon: '🥩', name: '불고기 덮밥', hunger: 35, slow: 30, fast: 30, joy: 5 },
    { id: 'ramen', kind: 'meal', icon: '🍜', name: '라면', hunger: 30, slow: 10, fast: 60, joy: 7 },
    { id: 'jjajang', kind: 'meal', icon: '🍝', name: '짜장면', hunger: 38, slow: 20, fast: 70, joy: 7 },
    { id: 'chicken', kind: 'meal', icon: '🍗', name: '치킨', hunger: 35, slow: 5, fast: 45, joy: 8 },
    { id: 'egg', kind: 'snack', icon: '🥚', name: '삶은 계란', hunger: 12, slow: 3, fast: 0, joy: 1, healthy: true },
    { id: 'nuts', kind: 'snack', icon: '🥜', name: '견과류', hunger: 10, slow: 3, fast: 0, joy: 1, healthy: true },
    { id: 'apple', kind: 'snack', icon: '🍎', name: '사과', hunger: 12, slow: 15, fast: 0, joy: 2, healthy: true },
    { id: 'yogurt', kind: 'snack', icon: '🥛', name: '무가당 요거트', hunger: 10, slow: 8, fast: 0, joy: 2, healthy: true },
    { id: 'banana', kind: 'snack', icon: '🍌', name: '바나나', hunger: 12, slow: 10, fast: 15, joy: 3 },
    { id: 'tteok', kind: 'snack', icon: '🍢', name: '떡볶이', hunger: 25, slow: 15, fast: 50, joy: 7 },
    { id: 'bungeo', kind: 'snack', icon: '🐟', name: '붕어빵', hunger: 15, slow: 10, fast: 35, joy: 6 },
    { id: 'icecream', kind: 'snack', icon: '🍦', name: '아이스크림', hunger: 12, slow: 0, fast: 55, joy: 8 },
    { id: 'cake', kind: 'snack', icon: '🍰', name: '케이크', hunger: 15, slow: 0, fast: 70, joy: 9 },
    { id: 'cola', kind: 'snack', icon: '🥤', name: '콜라', hunger: 5, slow: 0, fast: 60, joy: 6 }
  ],
  FULL_LIMIT: 90,          // 포만감이 이 이상이면 더 못 먹음
  INSULIN: { PER_UNIT: 20, MIN_UNITS: 1, MAX_UNITS: 8, DEFAULT_UNITS: 4, COOLDOWN: 180, FATAL_BELOW: 30 },
  // 운동: energy/hunger 소모량, bs=혈당 감소량
  EXERCISES: [
    { id: 'walk', icon: '🚶', name: '걷기', energy: 6, hunger: 4, bs: 12, joy: 2 },
    { id: 'bike', icon: '🚴', name: '자전거', energy: 12, hunger: 7, bs: 22, joy: 3 },
    { id: 'rope', icon: '🪢', name: '줄넘기', energy: 16, hunger: 9, bs: 28, joy: 3 },
    { id: 'run', icon: '🏃', name: '달리기', energy: 18, hunger: 10, bs: 30, joy: 3 },
    { id: 'taekwondo', icon: '🥋', name: '태권도', energy: 20, hunger: 11, bs: 32, joy: 4 },
    { id: 'swim', icon: '🏊', name: '수영', energy: 24, hunger: 14, bs: 38, joy: 4 }
  ],
  MEASURE_MS: 4000,
  // 성장: 정상 혈당을 유지하면 경험치가 쌓이고 단계가 오름
  GROWTH: { XP_PER_MIN: 0.1, STAGES: [0, 100, 300, 600], NAMES: ['아기', '꼬마', '청소년', '어른'], SCALE: [0.7, 0.85, 1, 1.1] }
};

/* ===== 상태/규칙 로직 (UI를 전혀 모름) ===== */
class Game {
  constructor(onEvent) { this.onEvent = onEvent; this.reset(); }
  reset() {
    const C = Config;
    this.s = { time: C.START_MIN, elapsed: 0, bs: C.BS.START, hunger: 70, energy: 90, happy: 80,
      slow: 0, fast: 0, sleeping: false, danger: 0, lastInsulin: -Infinity, over: null, xp: 0, stage: 0 };
  }
  calcStage() { return Config.GROWTH.STAGES.filter(t => this.s.xp >= t).length - 1; }
  clamp(v, max = Config.STAT.MAX) { return Math.max(0, Math.min(max, v)); }
  get status() {
    const b = this.s.bs, B = Config.BS;
    if (b < B.LOW) return 'low';
    if (b >= B.HYPER) return 'high';
    return b > B.HIGH ? 'warn' : 'normal';
  }
  /* 게임 내 1분 진행 */
  step() {
    const s = this.s, C = Config, S = C.STAT;
    if (s.over) return;
    s.time++; s.elapsed++;
    // 소화: 먹은 음식이 서서히 혈당으로 전환
    const f = Math.min(s.fast, C.DIGEST.fast), sl = Math.min(s.slow, C.DIGEST.slow);
    s.fast -= f; s.slow -= sl;
    s.bs += f + sl - C.BS.DRIFT;
    // 포만감/에너지
    s.hunger -= S.HUNGER_DECAY * (s.sleeping ? S.HUNGER_SLEEP_RATE : 1);
    s.energy += s.sleeping ? S.ENERGY_SLEEP : -S.ENERGY_DECAY;
    if (s.hunger <= 0) { s.bs -= S.STARVE_BS_DROP; s.happy -= S.HAPPY_HUNGRY; }  // 굶으면 저혈당 위험
    // 기분
    const st = this.status;
    if (st === 'normal') { s.happy += S.HAPPY_UP; s.xp += C.GROWTH.XP_PER_MIN; this.onEvent('track', 'normalHour', 1 / 60); }
    else if (st === 'warn') s.happy -= S.HAPPY_IDLE;
    else s.happy -= S.HAPPY_DOWN;
    const ns = this.calcStage(); if (ns > s.stage) { s.stage = ns; this.onEvent('grow', ns); }  // 성장 판정
    // 범위 보정
    s.bs = this.clamp(s.bs, C.BS.MAX); s.hunger = this.clamp(s.hunger);
    s.energy = this.clamp(s.energy); s.happy = this.clamp(s.happy);
    if (s.sleeping && s.energy >= S.MAX) { s.sleeping = false; this.onEvent('wake', '개운하게 일어났어요!'); }
    // 위험 혈당 지속 시간 누적 → 기절
    if (s.bs < C.BS.FAINT_LOW || s.bs >= C.BS.FAINT_HIGH) s.danger++;
    else s.danger = Math.max(0, s.danger - C.DANGER_RECOVER);
    if (s.danger >= C.DANGER_LIMIT) return this.end('faint', s.bs < C.BS.FAINT_LOW ? '저혈당이 너무 오래 이어져 기절했어요.' : '고혈당이 너무 오래 이어져 기절했어요.');
    if (s.elapsed % C.MIN_PER_DAY === 0) this.onEvent('track', 'gameDay', 1);
    if (s.elapsed >= C.CLEAR_DAYS * C.MIN_PER_DAY) this.end('clear', `${C.CLEAR_DAYS}일 동안 건강하게 지켜냈어요!`);
  }
  end(type, text) { this.s.over = { type, text }; if (type === 'clear') this.onEvent('track', 'clear', 1); this.onEvent('over', text); }
  /* 행동 (실패 시 사유를 메시지로 알림) */
  act(name, id) {
    const s = this.s, C = Config;
    if (s.over) return;
    if (name === 'sleep') {
      s.sleeping = !s.sleeping;
      return this.onEvent('info', s.sleeping ? '쿨쿨... 잠들었어요.' : '잠에서 깼어요.');
    }
    if (s.sleeping) return this.onEvent('warn', '자는 중이에요. 먼저 깨워주세요!');
    if (name === 'measure') this.onEvent('track', 'measure', 1);
    if (name === 'measure') return this.onEvent('measure', `혈당 ${Math.round(s.bs)} mg/dL`);
    if (name === 'eat') {
      const f = C.FOODS.find(x => x.id === id);
      if (!f) return;
      if (s.hunger >= C.FULL_LIMIT) return this.onEvent('warn', '배불러서 못 먹겠대요.');
      s.hunger = this.clamp(s.hunger + f.hunger); s.slow += f.slow; s.fast += f.fast;
      s.happy = this.clamp(s.happy + f.joy);
      if (f.healthy) this.onEvent('track', 'healthy', 1);
      return this.onEvent('info', f.fast >= 50 ? `${f.name}... 혈당이 확 오를 거예요!` : f.fast >= 15 ? `${f.name} 냠냠. 혈당이 보통 속도로 올라요.` : `${f.name}! 혈당이 천천히 올라요.`);
    }
    if (name === 'exercise') {
      const E = C.EXERCISES.find(x => x.id === id);
      if (!E) return;
      if (s.energy < E.energy) return this.onEvent('warn', `너무 피곤해서 ${E.name}을(를) 못 해요.`);
      if (s.hunger < E.hunger) return this.onEvent('warn', '배가 너무 고파서 운동을 못 해요.');
      s.energy = this.clamp(s.energy - E.energy); s.hunger = this.clamp(s.hunger - E.hunger);
      s.bs = this.clamp(s.bs - E.bs, C.BS.MAX); s.happy = this.clamp(s.happy + E.joy);
      this.onEvent('track', 'exercise', 1);
      return this.onEvent(s.bs < C.BS.LOW ? 'warn' : 'info', s.bs < C.BS.LOW ? `${E.name} 후 혈당이 너무 낮아졌어요! 간식이 필요해요.` : `${E.name} 완료! 혈당이 내려가요.`);
    }
    if (name === 'insulin') return this.insulin(Number(id) || Config.INSULIN.DEFAULT_UNITS);
  }
  insulin(units) {
    const s = this.s, I = Config.INSULIN;
    if (s.bs < Config.BS.LOW) return this.end('shock', '저혈당 상태에서 인슐린을 맞아 급성 쇼크가 왔어요!');
    // 짧은 간격의 중복 투여는 효과가 두 배 (과다 투여)
    const overdose = s.elapsed - s.lastInsulin < I.COOLDOWN;
    s.bs = this.clamp(s.bs - units * I.PER_UNIT * (overdose ? 2 : 1), Config.BS.MAX);
    s.lastInsulin = s.elapsed;
    if (s.bs <= I.FATAL_BELOW) return this.end('shock', overdose ? '인슐린을 연달아 맞아 급성 쇼크가 왔어요!' : '혈당이 높지 않을 때 인슐린을 맞아 급성 쇼크가 왔어요!');
    this.onEvent('info', overdose ? '⚠️ 연속 투여! 혈당이 너무 빨리 떨어져요.' : '인슐린 투여 완료.');
  }
}

/* ===== 화면 표시 (게임 규칙을 모름, 상태만 읽음) ===== */
const View = {
  $: id => document.getElementById(id),
  faceOf(g) {  // [표정, css클래스, 땀]
    const s = g.s, st = g.status;
    if (s.over) return s.over.type === 'clear' ? ['happy', '', 0] : ['dead', 'dead', 0];
    if (s.sleeping) return ['sleep', 'sleep', 0];
    if (st === 'low') return ['sad', 'sad', 1];
    if (st === 'high') return ['dizzy', 'dizzy', 0];
    if (s.hunger < 20 || s.happy < 30) return ['sad', 'sad', 0];
    return [s.happy > 70 ? 'happy' : 'normal', '', 0];
  },
  render(g, p) {
    const s = g.s, day = Math.floor(s.time / Config.MIN_PER_DAY) - Math.floor(Config.START_MIN / Config.MIN_PER_DAY) + 1;
    const m = s.time % Config.MIN_PER_DAY, pad = n => String(n).padStart(2, '0');
    this.$('clock').textContent = `Day ${Math.min(day, Config.CLEAR_DAYS)}/${Config.CLEAR_DAYS} ${pad(Math.floor(m / 60))}:${pad(Math.floor(m % 60))}`;
    const [mood, cls, sweat] = this.faceOf(g);
    const pet = this.$('pet'); pet.className = cls;
    const sig = [p.species, mood, sweat, s.stage, JSON.stringify(p.eq)].join('|');  // 바뀔 때만 다시 그림
    if (sig !== this._sig) { this._sig = sig; pet.innerHTML = Pets.svg(p.species, mood, s.stage, p.eq, sweat); }
    this.$('tag').textContent = `${p.name} · ${Config.GROWTH.NAMES[s.stage]}`;
    const lcd = this.$('lcd');
    lcd.classList.toggle('night', s.sleeping);
    lcd.style.backgroundColor = s.sleeping ? '' : (Items.color(p.eq.bg) || '');
    lcd.classList.toggle('danger', !s.over && s.danger > 0);
    this.$('b-hunger').style.width = s.hunger + '%';
    this.$('b-energy').style.width = s.energy + '%';
    this.$('b-happy').style.width = s.happy + '%';
    this.$('sleepBtn').innerHTML = s.sleeping ? '<span>☀️</span>깨우기' : '<span>🌙</span>수면';
    document.querySelectorAll('[data-act]').forEach(b => { if (b.dataset.act !== 'sleep') b.disabled = !!s.over; });
  },
  say(text) { this.$('msg').textContent = text; },
  showBS(text, ms) {
    const el = this.$('bs'); el.textContent = '🩸 ' + text.replace('혈당 ', ''); el.style.display = 'block';
    clearTimeout(this._t); this._t = setTimeout(() => el.style.display = 'none', ms);
  },
  overlay(type, text, onRestart) {
    const clear = type === 'clear';
    this.$('ov-title').textContent = clear ? '🎉 게임 클리어!' : '💔 게임 오버';
    this.$('ov-text').textContent = text + (clear ? ' 꾸준한 혈당 관리가 최고의 치료예요.' : ' 혈당은 너무 높아도, 너무 낮아도 위험해요.');
    this.$('ov-btn').onclick = () => { this.$('overlay').style.display = 'none'; onRestart(); };
    this.$('overlay').style.display = 'flex';
  }
};

/* ===== 저장 (브라우저 저장소, 실패해도 게임은 계속) ===== */
const Store = {
  key: 'diaTama.v1', _t: 0,
  load() { try { return JSON.parse(localStorage.getItem(this.key)); } catch (e) { return null; } },
  save(d) { try { localStorage.setItem(this.key, JSON.stringify(d)); } catch (e) { /* 저장소 사용 불가 시 무시 */ } },
  saveSoon(d) { clearTimeout(this._t); this._t = setTimeout(() => this.save(d), 2000); }
};

/* ===== 미션: 일일(날짜)·주간(월요일 기준)·월간(달) 단위로 자동 초기화 ===== */
const Missions = {
  defs: [
    { id: 'd1', period: 'daily', stat: 'measure', goal: 3, star: 1, label: '혈당 3번 재기' },
    { id: 'd2', period: 'daily', stat: 'healthy', goal: 3, star: 1, label: '건강식 3번 먹이기' },
    { id: 'd3', period: 'daily', stat: 'normalHour', goal: 12, star: 1, label: '정상 혈당 12시간 유지 (게임 시간)' },
    { id: 'w1', period: 'weekly', stat: 'healthy', goal: 15, star: 4, label: '건강식 15번 먹이기' },
    { id: 'w2', period: 'weekly', stat: 'exercise', goal: 8, star: 4, label: '운동 8번 하기' },
    { id: 'w3', period: 'weekly', stat: 'gameDay', goal: 7, star: 4, label: '게임 속 7일 무사히 보내기' },
    { id: 'm1', period: 'monthly', stat: 'clear', goal: 2, star: 12, label: '7일 생존 클리어 2번' },
    { id: 'm2', period: 'monthly', stat: 'normalHour', goal: 300, star: 12, label: '정상 혈당 300시간 유지' },
    { id: 'm3', period: 'monthly', stat: 'healthy', goal: 60, star: 12, label: '건강식 60번 먹이기' }
  ],
  keyOf(per, d = new Date()) {
    if (per === 'monthly') return `${d.getFullYear()}-${d.getMonth() + 1}`;
    if (per === 'daily') return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
    const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return `W${mon.getFullYear()}-${mon.getMonth() + 1}-${mon.getDate()}`;
  },
  sync(p) {
    ['daily', 'weekly', 'monthly'].forEach(per => {
      const k = this.keyOf(per);
      if (!p.mis[per] || p.mis[per].k !== k) p.mis[per] = { k, prog: {}, done: {} };
    });
  },
  track(p, stat, n, say) {
    this.sync(p);
    for (const d of this.defs) {
      if (d.stat !== stat) continue;
      const m = p.mis[d.period];
      m.prog[d.id] = (m.prog[d.id] || 0) + n;
      if (!m.done[d.id] && m.prog[d.id] >= d.goal) { m.done[d.id] = true; p.stars += d.star; say(`🎯 ${d.label} 완료! ⭐+${d.star}`); }
    }
    Store.saveSoon(p);
  }
};

/* ===== 직접 조작 엔진: 단계(tap/hold/drag/slider)를 순서대로 수행하면 실제 행동이 적용됨 ===== */
const Stage = {
  init() { View.$('stCancel').onclick = () => this.end(false); },
  start(title, steps, done) {
    Object.assign(this, { steps, done, i: 0, vals: {} });
    View.$('stTitle').textContent = title; View.$('stage').style.display = 'flex';
    App.paused = true; this.render();   // 조작 중에는 게임 시간 정지
  },
  end(ok) {
    View.$('stage').style.display = 'none'; App.paused = false;
    if (ok) this.done(this.vals); else View.say('취소했어요.');
  },
  next() { this.i++; this.i >= this.steps.length ? this.end(true) : this.render(); },
  bar(r) { View.$('stBar').style.width = (r * 100) + '%'; },
  render() {
    const st = this.steps[this.i], area = View.$('stArea');
    View.$('stText').textContent = `(${this.i + 1}/${this.steps.length}) ${st.text}`;
    this.bar(0); area.innerHTML = ''; area.style.justifyContent = st.type === 'drag' ? 'space-between' : 'center';
    this[st.type](st, area);
  },
  tool(icon, cls = '') { const d = document.createElement('div'); d.className = 'tool ' + cls; d.textContent = icon; return d; },
  /* 여러 번 톡톡 */
  tap(st, area) {
    const t = this.tool(st.icon); let n = 0;
    t.onpointerdown = e => {
      e.preventDefault(); if (n >= st.n) return;
      t.classList.remove('pop'); void t.offsetWidth; t.classList.add('pop');
      this.bar(++n / st.n); if (n >= st.n) setTimeout(() => this.next(), 150);
    };
    area.append(t);
  },
  /* 꾹 누르기: 손을 떼면 처음부터 */
  hold(st, area) {
    const t = this.tool(st.icon); let start = 0, raf = 0, done = false;
    const tick = () => {
      const r = Math.min(1, (performance.now() - start) / st.ms); this.bar(r);
      if (r >= 1) { done = true; return this.next(); }
      raf = requestAnimationFrame(tick);
    };
    t.onpointerdown = e => { e.preventDefault(); if (!done) { start = performance.now(); raf = requestAnimationFrame(tick); } };
    t.onpointerup = t.onpointercancel = t.onpointerleave = () => { if (!done) { cancelAnimationFrame(raf); this.bar(0); } };
    area.append(t);
  },
  /* 끌어다 놓기: 목표 칸에 겹치면 성공 */
  drag(st, area) {
    const zone = this.tool(st.target, 'zone'), item = this.tool(st.icon); area.append(zone, item);
    let sx = 0, sy = 0, on = false;
    item.onpointerdown = e => { on = true; sx = e.clientX; sy = e.clientY; item.setPointerCapture(e.pointerId); };
    item.onpointermove = e => { if (on) item.style.transform = `translate(${e.clientX - sx}px,${e.clientY - sy}px)`; };
    item.onpointercancel = () => { on = false; item.style.transform = ''; };
    item.onpointerup = () => {
      if (!on) return; on = false;
      const a = item.getBoundingClientRect(), b = zone.getBoundingClientRect();
      if (a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top) { this.bar(1); this.next(); }
      else item.style.transform = '';
    };
  },
  /* 값 고르기 (인슐린 용량) */
  slider(st, area) {
    const v = document.createElement('div'), r = document.createElement('input'), ok = document.createElement('button');
    r.type = 'range'; r.min = st.min; r.max = st.max; r.value = st.def; r.style.width = '85%';
    const show = () => v.innerHTML = `<b style="font-size:40px">${r.value}단위</b><br>혈당이 약 ${r.value * Config.INSULIN.PER_UNIT} 내려가요`;
    r.oninput = show; show(); v.style.textAlign = 'center';
    ok.className = 'big'; ok.textContent = '이 용량으로 결정';
    ok.onclick = () => { this.vals[st.key] = Number(r.value); this.next(); };
    area.append(v, r, ok);
  }
};

const Flows = {
  build(name, id) {
    const I = Config.INSULIN;
    if (name === 'measure') return { title: '🩸 혈당 측정', act: 'measure', steps: [
      { type: 'drag', text: '시험지를 측정기에 꽂아주세요', icon: '📏', target: '📟' },
      { type: 'tap', text: '채혈침으로 손가락을 콕!', icon: '📌', n: 1 },
      { type: 'hold', text: '피를 시험지에 묻혀요 (꾹 누르세요)', icon: '🩸', ms: 1200 }] };
    if (name === 'eat') {
      const f = Config.FOODS.find(x => x.id === id);
      return { title: `${f.icon} ${f.name}`, act: 'eat', id, steps: [
        { type: 'drag', text: `${f.name}을(를) 입에 넣어주세요`, icon: f.icon, target: '👄' },
        { type: 'tap', text: '냠냠! 꼭꼭 씹어요', icon: '😋', n: 5 }] };
    }
    if (name === 'insulin') return { title: '💉 인슐린 주사', act: 'insulin', steps: [
      { type: 'slider', text: '인슐린 용량을 정해주세요', key: 'units', min: I.MIN_UNITS, max: I.MAX_UNITS, def: I.DEFAULT_UNITS },
      { type: 'tap', text: '알코올 솜으로 닦아요', icon: '🧴', n: 3 },
      { type: 'hold', text: '주사를 꾹 눌러 주입해요', icon: '💉', ms: 1500 }] };
    if (name === 'exercise') {
      const E = Config.EXERCISES.find(x => x.id === id);
      return { title: `${E.icon} ${E.name}`, act: 'exercise', id, steps: [
        { type: 'tap', text: `${E.name}! 빠르게 터치하세요`, icon: E.icon, n: 8 + E.energy }] };  // 힘든 운동일수록 터치 횟수 증가
    }
    return { title: '🌙 잠자리', act: 'sleep', steps: [
      { type: 'tap', text: '불을 꺼주세요', icon: '💡', n: 1 },
      { type: 'drag', text: '이불을 덮어주세요', icon: '🛏️', target: '🐾' }] };
  }
};

/* ===== 음식/운동 선택창 ===== */
const Picker = {
  init(app) {
    this.app = app;
    View.$('pkClose').onclick = () => this.close();
    View.$('pkBody').onclick = e => {
      const c = e.target.closest('[data-id]');
      if (!c) return;
      const id = c.dataset.id; this.close();
      this.app.run(this.kind === 'exercise' ? 'exercise' : 'eat', id);
    };
  },
  tag(f) {  // 혈당이 오르는 속도 표시 (학습 요소)
    if (f.fast >= 50) return '<span style="color:#e0405a">혈당 빠르게 ↑↑</span>';
    if (f.fast >= 15) return '<span style="color:#c98a00">혈당 보통 ↑</span>';
    return '<span style="color:#2a9d5c">혈당 천천히 ↗</span>';
  },
  open(kind) {
    this.kind = kind;
    const titles = { meal: '🍚 식사 고르기', snack: '🍪 간식 고르기', exercise: '🏃 운동 고르기' };
    View.$('pkTitle').textContent = titles[kind];
    View.$('pkBody').innerHTML = kind === 'exercise'
      ? Config.EXERCISES.map(x => `<button class="card" data-id="${x.id}"><div style="font-size:28px">${x.icon}</div>${x.name}<br><small>에너지 -${x.energy} · 혈당 -${x.bs}</small></button>`).join('')
      : Config.FOODS.filter(f => f.kind === kind).map(f => `<button class="card" data-id="${f.id}"><div style="font-size:28px">${f.icon}</div>${f.name}<br><small>포만감 +${f.hunger}<br>${this.tag(f)}</small></button>`).join('');
    View.$('picker').style.display = 'flex'; this.app.paused = true;
  },
  close() { View.$('picker').style.display = 'none'; this.app.paused = false; }
};

/* ===== 컨트롤러: 게임 루프와 입력 연결 ===== */
const App = {
  speed: 1, last: 0, acc: 0,
  init() {
    this.p = Profile.load(); this.paused = true;
    this.game = new Game((t, x, n) => this.onEvent(t, x, n));
    Menu.init(this); Picker.init(this); Stage.init();
    if (this.p.name) this.paused = false; else Menu.openSetup();   // 처음이면 캐릭터 선택부터
    document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => this.onAct(b.dataset.act)));
    const ff = View.$('ff');
    ff.addEventListener('click', () => {
      this.speed = this.speed === 1 ? Config.FAST_FORWARD : 1;
      ff.classList.toggle('on', this.speed > 1);
      ff.textContent = this.speed > 1 ? `⏩ x${this.speed}` : '⏩ 빨리감기';
    });
    // 모바일: 더블탭 확대/핀치 줌 방지
    document.addEventListener('dblclick', e => e.preventDefault());
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('contextmenu', e => e.preventDefault());
    requestAnimationFrame(t => { this.last = t; this.loop(t); });
  },
  onAct(name) {
    const s = this.game.s;
    if (s.over) return;
    if (s.sleeping && name !== 'sleep') return View.say('자는 중이에요. 먼저 깨워주세요!');
    if (['meal', 'snack', 'exercise'].includes(name)) return Picker.open(name);   // 종류 선택 후 조작
    if (name === 'sleep' && s.sleeping) return this.game.act('sleep');             // 깨우기는 바로
    this.run(name);
  },
  /* 조작 흐름 시작 (시작 전에 불가능한 상황은 미리 막음) */
  run(name, id) {
    const s = this.game.s, C = Config;
    if (name === 'eat' && s.hunger >= C.FULL_LIMIT) return View.say('배불러서 못 먹겠대요.');
    if (name === 'exercise') {
      const E = C.EXERCISES.find(x => x.id === id);
      if (s.energy < E.energy) return View.say(`너무 피곤해서 ${E.name}을(를) 못 해요.`);
      if (s.hunger < E.hunger) return View.say('배가 너무 고파서 운동을 못 해요.');
    }
    const f = Flows.build(name, id);
    Stage.start(f.title, f.steps, v => this.game.act(f.act, f.act === 'insulin' ? v.units : f.id));
  },
  onEvent(type, text, n) {
    if (type === 'track') return Missions.track(this.p, text, n, msg => View.say(msg));
    if (type === 'grow') return View.say(`${this.p.name}이(가) '${Config.GROWTH.NAMES[text]}' 단계로 성장했어요! 🎉`);
    if (type === 'measure') View.showBS(text, Config.MEASURE_MS);
    if (type === 'over') { View.render(this.game, this.p); View.say(text); return View.overlay(this.game.s.over.type, text, () => { this.game.reset(); this.acc = 0; View.say('새로운 하루가 시작됐어요!'); }); }
    View.say(text);
  },
  loop(now) {
    const dt = Math.min((now - this.last) / 1000, Config.MAX_FRAME_SEC);  // 프레임 간 경과(초)
    this.last = now;
    if (!this.game.s.over && !this.paused) {
      this.acc += dt * Config.TIME_SCALE * this.speed;   // 게임 분으로 환산 후 1분 단위로 나눠 처리 (배속에도 정확)
      while (this.acc >= 1 && !this.game.s.over) { this.game.step(); this.acc -= 1; }
    }
    View.render(this.game, this.p);
    requestAnimationFrame(t => this.loop(t));
  }
};
App.init();
</script>
